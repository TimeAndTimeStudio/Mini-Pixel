<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="workspace">
      <div id="canvas-wrapper">
        <canvas id="display-canvas"></canvas>
      </div>
      <div id="statusbar">
        <span id="status-size">Canvas: <b>64 × 64</b></span>
        <span id="status-pixel">—</span>
        <span id="status-zoom">Zoom: <b>4×</b> · Rotation: <b>0°</b></span>
      </div>
    </div>

    <div id="toolbar-dock">
      <button id="toolbar-toggle" data-collapsed="true" title="Expand toolbar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    <aside id="toolbar" class="collapsed">
      <div id="toolbar-inner">
      <span class="brand" title="Pixel Draw">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2 L22 12 L12 22 L2 12 Z" fill="currentColor"/>
        </svg>
      </span>

      <div class="group" id="tool-group">
        <div class="row icon-row">
          <button id="btn-pencil" class="tool-btn icon-btn active" title="Pencil (P)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 21l3.6-.9c.4-.1.8-.3 1.1-.6L19.4 8.2c.8-.8.8-2 0-2.8l-.8-.8c-.8-.8-2-.8-2.8 0L4.5 15.3c-.3.3-.5.7-.6 1.1L3 21z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <span class="sr-only">Pencil</span>
          </button>
          <button id="btn-eraser" class="tool-btn icon-btn" title="Eraser (E)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18.5 3.5l2 2c.6.6.6 1.5 0 2.1L9.7 18.4H5.1L3 16.3v-1.4L14.4 3.5c.6-.6 1.5-.6 2.1 0z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M4 20.5h9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Eraser</span>
          </button>
          <button id="btn-eyedropper" class="tool-btn icon-btn" title="Eyedropper (I)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17.5 2.5a2.7 2.7 0 0 1 3.8 3.8l-2 2-3.8-3.8 2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M15.5 6.3L5.8 16l-1.3 4.5 4.5-1.3L18.7 9.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M4.5 20.5l1.3-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Eyedropper</span>
          </button>
        </div>
        <div class="row" id="size-row" title="Brush size (shared by pencil &amp; eraser)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
          <label for="brush-size-slider" class="sr-only">Brush size</label>
          <input type="range" id="brush-size-slider" min="1" max="16" value="1">
          <span id="brush-size-value">1px</span>
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="color-group">
        <div id="wheel-wrap">
          <canvas id="color-wheel" width="152" height="152"></canvas>
          <div id="wheel-dot"></div>
        </div>
        <input type="range" id="value-slider" min="0" max="100" value="100" title="Brightness">
        <div class="row">
          <div id="color-swatch-wrap" title="Current color">
            <div id="color-swatch"></div>
          </div>
          <input type="text" id="hex-input" value="#5EEAD4" maxlength="7" spellcheck="false">
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="mirror-group">
        <div class="row icon-row">
          <button id="btn-mirror-x" class="mirror-btn icon-btn" title="Mirror X (M)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 3v18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>
              <path d="M5 8L2 12l3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 8l3 4-3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only">Mirror X</span>
          </button>
          <button id="btn-mirror-y" class="mirror-btn icon-btn" title="Mirror Y (N)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 12h18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>
              <path d="M8 5L12 2l4 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 19l4 3 4-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only">Mirror Y</span>
          </button>
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="size-group">
        <div class="row">
          <label for="input-width">W</label>
          <input type="number" id="input-width" value="64" min="1" max="2048">
        </div>
        <div class="row">
          <label for="input-height">H</label>
          <input type="number" id="input-height" value="64" min="1" max="2048">
        </div>
        <div class="row icon-row">
          <button id="btn-new" class="icon-btn" title="New canvas">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 11v6M9 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">New canvas</span>
          </button>
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="view-group">
        <div class="row">
          <label for="zoom-select" class="sr-only">Zoom</label>
          <select id="zoom-select" title="Zoom">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4" selected>4×</option>
            <option value="8">8×</option>
            <option value="16">16×</option>
            <option value="32">32×</option>
            <option value="64">64×</option>
          </select>
        </div>
        <div class="row icon-row">
          <button id="btn-rotate-left" class="icon-btn" title="Rotate left ([)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 12a8 8 0 1 1 2.3 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M4 8v4.5H8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only">Rotate left</span>
          </button>
          <button id="btn-rotate-right" class="icon-btn" title="Rotate right (])">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M20 12a8 8 0 1 0-2.3 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M20 8v4.5h-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only">Rotate right</span>
          </button>
          <button id="btn-reset-view" class="icon-btn" title="Reset pan, zoom and rotation">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Reset view</span>
          </button>
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="history-group">
        <div class="row icon-row">
          <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M8 7L4 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 11h10a5 5 0 0 1 0 10h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Undo</span>
          </button>
          <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M16 7l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 11H10a5 5 0 0 0 0 10h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Redo</span>
          </button>
        </div>
      </div>
      <div class="divider"></div>

      <div class="group" id="io-group">
        <div class="row icon-row">
          <button id="btn-import" class="icon-btn" title="Import PNG">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 3v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M7.5 10L12 14.5 16.5 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Import</span>
          </button>
          <button id="btn-export" class="icon-btn" title="Export PNG">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 15V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M7.5 7.5L12 3l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">Export</span>
          </button>
        </div>
        <input type="file" id="file-input" accept="image/png">
      </div>
      </div>
    </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
