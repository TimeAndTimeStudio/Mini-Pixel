<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div id="tool-group">
        <button id="btn-pencil" class="tool-btn active" title="Pencil (P)">✏️ Pencil</button>
        <button id="btn-eraser" class="tool-btn" title="Eraser (E)">🧹 Eraser</button>
      </div>
      <div id="color-group">
        <input type="color" id="color-picker" value="#000000" title="Color">
      </div>
      <div id="mirror-group">
        <button id="btn-mirror-x" class="mirror-btn" title="Mirror X (M)">Mirror X</button>
        <button id="btn-mirror-y" class="mirror-btn" title="Mirror Y (N)">Mirror Y</button>
      </div>
      <div id="size-group">
        <label for="input-width">W</label>
        <input type="number" id="input-width" value="64" min="1" max="1024">
        <label for="input-height">H</label>
        <input type="number" id="input-height" value="64" min="1" max="1024">
        <button id="btn-new">New</button>
      </div>
      <div id="zoom-group">
        <label for="zoom-select">Zoom</label>
        <select id="zoom-select">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="4" selected>4x</option>
          <option value="8">8x</option>
          <option value="16">16x</option>
          <option value="32">32x</option>
          <option value="64">64x</option>
        </select>
      </div>
      <div id="history-group">
        <button id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Y)">↪ Redo</button>
      </div>
      <div id="io-group">
        <button id="btn-import" title="Import PNG">📥 Import</button>
        <button id="btn-export" title="Export PNG">📤 Export</button>
        <input type="file" id="file-input" accept="image/png" style="display:none">
      </div>
    </div>
    <div id="canvas-wrapper">
      <canvas id="display-canvas"></canvas>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
